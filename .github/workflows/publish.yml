name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor asciidoctor-pdf

      - name: Build HTML
        run: |
          mkdir -p output
          asciidoctor \
            -b html5 \
            -D output \
            -o index.html \
            AsciiDoc_Source/main.adoc

      - name: Build PDF
        run: |
          asciidoctor-pdf \
            -D output \
            -o supplement.pdf \
            AsciiDoc_Source/main.adoc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supplement-output
          path: output/
          retention-days: 90
